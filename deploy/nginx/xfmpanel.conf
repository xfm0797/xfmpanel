# XFMPanel 面板反向代理示例
# 放置到 /etc/nginx/sites-available/xfmpanel.conf 并软链到 sites-enabled，
# 证书可用面板自身的 ACME（或先在面板外签好再替换路径）。
#
# 要点：
#  1) 面板只监听 127.0.0.1:8787，公网访问必须经由本代理；
#  2) /api/v1/tasks/<id>/events 是 SSE 长连接，必须关闭缓冲；
#  3) 强制 HTTPS + HSTS，避免会话 Cookie 走明文。

upstream xfmpanel_backend {
    server 127.0.0.1:8787;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name panel.example.com;

    # ACME HTTP-01 校验目录（如用 certbot --webroot）
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name panel.example.com;

    ssl_certificate     /etc/letsencrypt/live/panel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:PanelSsl:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 面板功能不需要上传大文件，收紧请求体
    client_max_body_size 8m;

    # 任务实时日志（SSE）：禁用缓冲，长超时
    location ~ ^/api/v1/tasks/[^/]+/events$ {
        proxy_pass http://xfmpanel_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://xfmpanel_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
    }

    # 可选：只允许办公网访问面板
    # allow 203.0.113.0/24;
    # allow 10.0.0.0/8;
    # deny all;
}
